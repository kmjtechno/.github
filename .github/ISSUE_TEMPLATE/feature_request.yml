name: Feature request
description: Propose a focused, verifiable improvement.
title: "[Feature] "
body:
  - type: textarea
    id: need
    attributes:
      label: Problem to solve
      description: Explain the user need rather than prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution and acceptance criteria
      description: Describe the behavior, safety boundaries and testable outcomes.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and compatibility considerations
    validations:
      required: false
